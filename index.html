<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F1521">
<title>CHILL Wi-Fi Zone</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;background:#0F1521;}
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0F1521; --surface:#17202E; --surface-2:#1F2B3D;
    --signal:#5EEAD4; --signal-dim:rgba(94,234,212,0.14);
    --amber:#F5A623; --amber-dim:rgba(245,166,35,0.14);
    --text:#E8EDF2; --muted:#7E8FA3; --danger:#EF6461; --border:#25334A;
  }
  *{box-sizing:border-box;}
  body{ color:var(--text); font-family:'Inter',sans-serif; }

  #wz-root{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    border-radius:0; padding:0; max-width:480px; margin:0 auto; overflow:hidden;
    min-height:100vh;
  }

  .wz-header{ padding:22px 22px 18px; display:flex; align-items:flex-start; justify-content:space-between; border-bottom:1px solid var(--border);}
  .wz-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.01em;}
  .wz-sub{ color:var(--muted); font-size:12.5px; margin-top:4px; display:flex; align-items:center; gap:6px;}
  .wz-sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--signal); display:inline-block; }
  .wz-sync-dot.offline{ background:var(--danger); }
  .wz-date{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-align:right; padding-top:3px;}

  .wz-hero{ display:flex; align-items:center; gap:18px; padding:22px; background:radial-gradient(120% 100% at 0% 0%, rgba(94,234,212,0.06), transparent 60%);}
  .wz-arc-wrap{ position:relative; width:112px; height:112px; flex:none;}
  .wz-arc-wrap svg{ transform:rotate(-90deg);}
  .wz-arc-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .wz-arc-pct{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--signal);}
  .wz-arc-label{ font-size:9px; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; margin-top:2px;}

  .wz-hero-stats{ flex:1; min-width:0;}
  .wz-stat-row{ display:flex; justify-content:space-between; padding:5px 0;}
  .wz-stat-row + .wz-stat-row{ border-top:1px dashed var(--border);}
  .wz-stat-label{ font-size:12px; color:var(--muted);}
  .wz-stat-value{ font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:700;}
  .wz-stat-value.amber{ color:var(--amber);}
  .wz-stat-value.signal{ color:var(--signal);}

  .wz-section-label{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding:0 22px; margin-bottom:10px; margin-top:4px; display:flex; justify-content:space-between; align-items:center;}

  .wz-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 22px 20px;}
  .wz-tarif-btn{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 12px; text-align:left; cursor:pointer; transition:transform .12s ease; color:var(--text); font-family:'Inter',sans-serif;}
  .wz-tarif-btn:active{ transform:scale(0.97);}
  .wz-tarif-amount{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--signal);}
  .wz-tarif-name{ font-size:11.5px; color:var(--muted); margin-top:3px;}

  .wz-log{ padding:0 22px 8px; max-height:220px; overflow-y:auto;}
  .wz-log-empty{ color:var(--muted); font-size:12.5px; padding:10px 0; text-align:center;}
  .wz-log-item{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--surface); border-radius:10px; margin-bottom:7px; font-size:12.5px;}
  .wz-log-left{ display:flex; align-items:center; gap:9px;}
  .wz-log-time{ font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:11px;}
  .wz-log-amount{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber);}
  .wz-log-del{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; border-radius:6px;}

  .wz-goals{ padding:0 22px 20px;}
  .wz-goal-row{ margin-bottom:12px;}
  .wz-goal-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; color:var(--muted); margin-bottom:5px;}
  .wz-goal-top strong{ font-family:'JetBrains Mono',monospace; color:var(--text); font-weight:700; font-size:12px;}
  .wz-goal-bar-bg{ height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .wz-goal-bar-fg{ height:100%; background:var(--signal); border-radius:99px; transition:width .3s ease;}
  .wz-goal-bar-fg.full{ background:var(--amber);}

  .wz-footer{ display:flex; gap:10px; padding:16px 22px 32px; border-top:1px solid var(--border);}
  .wz-btn{ flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; cursor:pointer;}
  .wz-btn.primary{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber);}

  .wz-toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px); background:var(--signal); color:#0F1521; font-weight:600; font-size:12px; padding:8px 14px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:999;}
  .wz-toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .wz-lock{ position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:50; padding:30px; text-align:center;}
  .wz-lock-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .wz-lock-sub{ color:var(--muted); font-size:12.5px; margin-top:-8px;}
  .wz-lock-input{ font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:0.3em; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text); padding:12px; width:140px; outline:none;}
  .wz-lock-error{ color:var(--danger); font-size:12px; height:14px;}
</style>
</head>
<body>

<div class="wz-lock" id="wz-lock">
  <div class="wz-lock-title">🔒 CHILL Wi-Fi Zone</div>
  <div class="wz-lock-sub">Entrez le code pour accéder au suivi</div>
  <input type="password" inputmode="numeric" maxlength="4" class="wz-lock-input" id="wz-lock-input" placeholder="••••">
  <div class="wz-lock-error" id="wz-lock-error"></div>
</div>

<div id="wz-root" style="display:none;">
  <div class="wz-header">
    <div>
      <div class="wz-title">CHILL Wi-Fi Zone</div>
      <div class="wz-sub"><span class="wz-sync-dot" id="wz-sync-dot"></span><span id="wz-sync-text">Synchronisé</span></div>
    </div>
    <div class="wz-date" id="wz-date"></div>
  </div>

  <div class="wz-hero">
    <div class="wz-arc-wrap">
      <svg width="112" height="112" viewBox="0 0 112 112">
        <circle cx="56" cy="56" r="48" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
        <circle id="wz-arc-fg" cx="56" cy="56" r="48" fill="none" stroke="var(--signal)" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
      </svg>
      <div class="wz-arc-center">
        <div class="wz-arc-pct" id="wz-pct">0%</div>
        <div class="wz-arc-label">Objectif</div>
      </div>
    </div>
    <div class="wz-hero-stats">
      <div class="wz-stat-row"><div class="wz-stat-label">Aujourd'hui</div><div class="wz-stat-value signal" id="wz-today">0 Ar</div></div>
      <div class="wz-stat-row"><div class="wz-stat-label">Cette semaine</div><div class="wz-stat-value signal" id="wz-week">0 Ar</div></div>
      <div class="wz-stat-row"><div class="wz-stat-label">Ce mois</div><div class="wz-stat-value amber" id="wz-month">0 Ar</div></div>
      <div class="wz-stat-row"><div class="wz-stat-label">Reste pour l'objectif</div><div class="wz-stat-value" id="wz-remain">—</div></div>
    </div>
  </div>

  <div class="wz-section-label"><span>Objectifs</span></div>
  <div class="wz-goals" id="wz-goals"></div>

  <div class="wz-section-label"><span>Enregistrer une vente</span></div>
  <div class="wz-grid" id="wz-tarifs"></div>

  <div class="wz-section-label"><span>Aujourd'hui</span></div>
  <div class="wz-log" id="wz-log"></div>

  <div class="wz-footer">
    <button class="wz-btn" id="wz-undo">↩ Annuler dernière</button>
  </div>
</div>

<div class="wz-toast" id="wz-toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFWSFp-gjwgabQnWuKq-iVKDM_1AmFSZE",
  authDomain: "chillice.firebaseapp.com",
  projectId: "chillice",
  storageBucket: "chillice.firebasestorage.app",
  messagingSenderId: "656777693124",
  appId: "1:656777693124:web:a6247d09cefecc3bebc691"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const salesCol = collection(db, "sales");

const APP_CODE = "2200"; // change-le ici si besoin

const TARIFS = [
  { label: "1 heure", amount: 500, color: "#F43F5E" },
  { label: "3 heures", amount: 1000, color: "#F5A623" },
  { label: "24 heures", amount: 2000, color: "#7C9EFF" },
  { label: "1 mois", amount: 20000, color: "#F472B6" }
];
const GOALS = { day: 10000, week: 50000, month: 200000 };

function colorForLabel(label){ const t = TARIFS.find(x=>x.label===label); return t? t.color : 'var(--signal)'; }
function fmt(n){ return n.toLocaleString('fr-FR').replace(/,/g,' ') + " Ar"; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function startOfWeekISO(){
  const d = new Date(); const day = d.getDay();
  const diff = (day===0?-6:1) - day;
  d.setDate(d.getDate()+diff); d.setHours(0,0,0,0);
  return d.toISOString();
}
function toast(msg){
  const el = document.getElementById('wz-toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=> el.classList.remove('show'), 1600);
}

// --- Verrouillage ---
const lockEl = document.getElementById('wz-lock');
const rootEl = document.getElementById('wz-root');
const lockInput = document.getElementById('wz-lock-input');
const lockError = document.getElementById('wz-lock-error');
function tryUnlock(){
  if(lockInput.value === APP_CODE){
    lockEl.style.display = 'none';
    rootEl.style.display = 'block';
  } else {
    lockError.textContent = "Code incorrect";
    lockInput.value = '';
  }
}
lockInput.addEventListener('input', ()=>{ lockError.textContent=''; if(lockInput.value.length===4) tryUnlock(); });
lockInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
lockInput.focus();

document.getElementById('wz-date').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

// --- Tarifs ---
const tarifsEl = document.getElementById('wz-tarifs');
TARIFS.forEach(t=>{
  const btn = document.createElement('button');
  btn.className = 'wz-tarif-btn';
  btn.style.borderLeft = `3px solid ${t.color}`;
  btn.innerHTML = `<div class="wz-tarif-amount" style="color:${t.color};">${fmt(t.amount)}</div><div class="wz-tarif-name">${t.label}</div>`;
  btn.onclick = ()=> addSale(t);
  tarifsEl.appendChild(btn);
});

async function addSale(t){
  try{
    await addDoc(salesCol, { label:t.label, amount:t.amount, ts: Timestamp.now() });
    toast(`+ ${fmt(t.amount)} enregistré`);
  }catch(e){ toast("Erreur réseau — réessaie"); }
}

let lastSaleId = null;
async function undoLast(){
  if(!lastSaleId) return;
  try{ await deleteDoc(doc(db,"sales", lastSaleId)); toast("Dernière vente annulée"); }
  catch(e){ toast("Erreur — réessaie"); }
}
document.getElementById('wz-undo').onclick = undoLast;

// --- Sync temps réel ---
const syncDot = document.getElementById('wz-sync-dot');
const syncText = document.getElementById('wz-sync-text');
let sales = [];

const q = query(salesCol, orderBy("ts","desc"));
onSnapshot(q, (snap)=>{
  sales = snap.docs.map(d=>{
    const data = d.data();
    return { id:d.id, label:data.label, amount:data.amount, ts: data.ts ? data.ts.toDate().toISOString() : new Date().toISOString() };
  });
  lastSaleId = sales.length ? sales[0].id : null;
  syncDot.classList.remove('offline');
  syncText.textContent = 'Synchronisé';
  render();
}, (err)=>{
  syncDot.classList.add('offline');
  syncText.textContent = 'Hors ligne';
});

window.addEventListener('online', ()=>{ syncDot.classList.remove('offline'); syncText.textContent='Synchronisé'; });
window.addEventListener('offline', ()=>{ syncDot.classList.add('offline'); syncText.textContent='Hors ligne'; });

function render(){
  const today = todayStr(), month = monthStr(), weekStart = startOfWeekISO();
  const todaySales = sales.filter(s=>s.ts.slice(0,10)===today);
  const weekSales = sales.filter(s=>s.ts>=weekStart);
  const monthSales = sales.filter(s=>s.ts.slice(0,7)===month);

  const todayTotal = todaySales.reduce((a,s)=>a+s.amount,0);
  const weekTotal = weekSales.reduce((a,s)=>a+s.amount,0);
  const monthTotal = monthSales.reduce((a,s)=>a+s.amount,0);
  const remain = Math.max(GOALS.month - monthTotal, 0);
  const pct = GOALS.month>0 ? Math.min(monthTotal/GOALS.month,1) : 0;

  document.getElementById('wz-today').textContent = fmt(todayTotal);
  document.getElementById('wz-week').textContent = fmt(weekTotal);
  document.getElementById('wz-month').textContent = fmt(monthTotal);
  document.getElementById('wz-remain').textContent = remain===0 ? "Objectif atteint" : fmt(remain);
  document.getElementById('wz-pct').textContent = Math.round(pct*100)+"%";

  const circumference = 301.6;
  const arc = document.getElementById('wz-arc-fg');
  arc.setAttribute('stroke-dashoffset', circumference*(1-pct));
  arc.setAttribute('stroke', pct>=1 ? 'var(--amber)' : 'var(--signal)');

  const goalsEl = document.getElementById('wz-goals');
  const rows = [
    {label:"Aujourd'hui", total:todayTotal, goal:GOALS.day},
    {label:"Cette semaine", total:weekTotal, goal:GOALS.week},
    {label:"Ce mois", total:monthTotal, goal:GOALS.month}
  ];
  goalsEl.innerHTML = rows.map(r=>{
    const p = r.goal>0 ? Math.min(r.total/r.goal,1) : 0;
    return `<div class="wz-goal-row">
      <div class="wz-goal-top"><span>${r.label}</span><strong>${fmt(r.total)} / ${fmt(r.goal)}</strong></div>
      <div class="wz-goal-bar-bg"><div class="wz-goal-bar-fg${p>=1?' full':''}" style="width:${Math.round(p*100)}%"></div></div>
    </div>`;
  }).join('');

  const logEl = document.getElementById('wz-log');
  if(todaySales.length===0){
    logEl.innerHTML = '<div class="wz-log-empty">Aucune vente enregistrée ce jour</div>';
  } else {
    logEl.innerHTML = '';
    todaySales.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'wz-log-item';
      const time = new Date(s.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const dot = `<span style="width:8px;height:8px;border-radius:50%;background:${colorForLabel(s.label)};flex:none;display:inline-block;"></span>`;
      row.innerHTML = `
        <div class="wz-log-left">${dot}<span class="wz-log-time">${time}</span><span>${s.label}</span></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="wz-log-amount" style="color:${colorForLabel(s.label)};">${fmt(s.amount)}</span>
          <button class="wz-log-del" data-id="${s.id}">✕</button>
        </div>`;
      logEl.appendChild(row);
    });
    logEl.querySelectorAll('.wz-log-del').forEach(b=>{
      b.onclick = async ()=>{
        try{ await deleteDoc(doc(db,"sales", b.dataset.id)); toast("Ticket supprimé"); }
        catch(e){ toast("Erreur — réessaie"); }
      };
    });
  }
}

// --- Service worker (installation + cache basique) ---
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
